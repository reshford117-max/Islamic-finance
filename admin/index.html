<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mizon — Admin: kirish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Onest:wght@400;500;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F5;--white:#fff;--ink:#14201B;--ink2:#3B4641;--muted:#5B6A63;--line:#E0E8E3;--em:#0C6A49;--em2:#1C9C6C;--em-soft:#D6F0E4;--red:#B5402C;--red-soft:#FCEEEB;
--head:'Manrope',system-ui,sans-serif;--body:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:24px;letter-spacing:.08em;color:#0E6B4E;text-decoration:none}
.brand small{font-family:var(--body);font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--em-soft);padding:3px 9px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;font-weight:600;cursor:pointer}
.btn-em{background:var(--em);color:#fff}.btn-em:hover{background:#0A5A3E}
.btn-em:disabled{opacity:.55;cursor:not-allowed}
.btn-line{background:#fff;border:1px solid var(--line)}.btn-line:hover{border-color:#C6D2CC}
.btn-red{background:var(--red-soft);color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}
label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:6px}
input,select{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:16px}
input:focus,select:focus{outline:2px solid var(--em2);outline-offset:1px;border-color:transparent}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
.err{background:var(--red-soft);color:#7A2717;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.ok{background:var(--em-soft);color:var(--em);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:400px;text-align:center}
.login .mark{width:72px;height:72px;margin:0 auto 14px}
.login h1{font-size:24px;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 20px}
.login form{text-align:left;display:grid;gap:12px}
/* main */
main{padding:26px 0 60px;display:grid;gap:22px}
.steps{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.preview{display:none;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px}
.preview.show{display:flex}
.preview img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;flex:none;background:#ddd}
.preview b{display:block;font-size:15px}
.preview small{color:var(--muted)}
.listhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--em);border-color:var(--em);color:#fff}
.vlist{display:grid;gap:10px}
.vi{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px}
.vi img{width:132px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;flex:none;background:#ddd}
.vi .tx{flex:1;min-width:0}
.vi b{display:block;font-size:15px;line-height:1.35}
.vi .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--em-soft);color:var(--em)}
.tag.eco{background:#DDE6FB;color:#2447A8}
.vi .act{display:flex;gap:6px;flex:none}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.ib:hover{border-color:#C6D2CC}
.ib.del{color:var(--red)}
a.ib{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:34px 12px;border:1.5px dashed var(--line);border-radius:18px}
dialog{border:0;border-radius:22px;padding:24px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(10,30,22,.45)}
dialog form{display:grid;gap:14px}
.dact{display:flex;gap:10px;justify-content:flex-end}
@media (max-width:640px){.row2{grid-template-columns:1fr}.vi{flex-wrap:wrap}.vi img{width:100%}.vi .act{width:100%;justify-content:flex-end}.preview{flex-direction:column;align-items:stretch}.preview img{width:100%}}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- ===== Kirish ===== -->
<section class="login" id="loginView">
  <div class="card">
    <svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><defs><mask id="m"><rect width="200" height="200" fill="#fff"/><circle cx="106" cy="96" r="13" fill="#000"/></mask></defs><rect x="8" y="8" width="184" height="184" rx="46" fill="#0E6B4E"/><rect x="62" y="62" width="76" height="76" fill="none" stroke="#D4A82E" stroke-width="5"/><rect x="62" y="62" width="76" height="76" fill="none" stroke="#D4A82E" stroke-width="5" transform="rotate(45 100 100)"/><circle cx="100" cy="100" r="27" fill="#0A4F3A" stroke="#D4A82E" stroke-width="2"/><circle cx="96" cy="100" r="15" fill="#D4A82E" mask="url(#m)"/><circle cx="116" cy="90" r="3" fill="#D4A82E"/></svg>
    <h1>Mizon admin panel</h1>
    <p>Videolarni boshqarish uchun parolni kiriting.</p>
    <form id="loginForm">
      <div><label for="pw">Parol</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:500;font-size:14px;cursor:pointer"><input type="checkbox" id="showPw" style="width:18px;min-height:18px;height:18px">Parolni ko‘rsatish</label></div>
      <button class="btn btn-em" type="submit">Kirish</button>
      <div id="loginErr" class="err" hidden></div>
    </form>
  </div>
</section>

<script>
(function(){
  var PW_KEY='mizon-admin-pw';
  var $=function(id){return document.getElementById(id);};
  function check(pw){
    return fetch('/api/login',{method:'POST',headers:{'x-admin-password':pw}})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw new Error(j.error||('Xato: '+r.status)); return j; });});
  }
  function go(){ location.replace('/admin/panel'); }
  var saved=sessionStorage.getItem(PW_KEY);
  if(saved){ check(saved).then(go).catch(function(){ sessionStorage.removeItem(PW_KEY); }); }
  $('showPw').addEventListener('change',function(){ $('pw').type=this.checked?'text':'password'; });
  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); var pw=$('pw').value.trim(), b=this.querySelector('button[type=submit]'), err=$('loginErr');
    err.hidden=true; b.disabled=true; b.textContent='Tekshirilmoqda…';
    check(pw).then(function(){ sessionStorage.setItem(PW_KEY,pw); go(); })
      .catch(function(x){ err.hidden=false; err.textContent=x.message; b.disabled=false; b.textContent='Kirish'; });
  });
})();
</script>
</body>
</html>
